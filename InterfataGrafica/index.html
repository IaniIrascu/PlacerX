<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML Project</title>
    <link rel="stylesheet" href="style.css"> <!-- Linking the CSS file -->
</head>
<div>
    <body>
    <div class = "topsite">
        <br><br>
        <div class = "mainheader">
            <header>
                <h1>STORE ASSIST</h1>
            </header>
            <a href = "#choosestore">
                <img src="Shoppingcart.png" alt="Store Image" class = "symbol">
            </a>
            <a href = "#choosestore">
                <img src="Store.jpg" alt ="Store Image" class="symbol">
            </a>
            <a href = "#choosestore">
                <img src="basket.jpg" alt ="Store Image" class="symbol">
            </a>
        </div>
        <br><br>
    </div>
    <br>
    <div class = "container">
        <div class = "box1">
            <br><br>
            <a href = "https://www.google.com/maps/place/New+York,+Statele+Unite+ale+Americii/@40.6970193,-74.309324,10z/data=!3m1!4b1!4m6!3m5!1s0x89c24fa5d33f083b:0xc80b8f06e177fe62!8m2!3d40.7127753!4d-74.0059728!16zL20vMDJfMjg2?entry=ttu&g_ep=EgoyMDI0MTIwNC4wIKXMDSoASAFQAw%3D%3D">
                <img src="../Harta_NYC.png" alt="Description of image" class = "imagemainmap" id = "image">
            </a>
            
        </div>
        <div class = "box2">
            <label for="city" id = "city" class = "stylelabel"><p class = "choose">Choose your city:</p></label>
            <select id="city_type" name="city_type" class = "styleselect">
                <option value="None">None</option>
                <option value="Bucharest">Bucharest</option>
                <option value="New York City">New York City</option>
            </select>
            <label for="store" id = "store" class = "stylelabel"><p class = "choose">Choose the type of store:</p></label>
            <select id="store_type" name="store_type" class = "styleselect">
                <option value="None">None</option>
                <option value="Grocery Store">Grocery Store</option>
                <option value="Supermarket">Supermarket</option>
                <option value="Department Store">Department Store</option>
            </select>
        </div>
    </div>
    
</body>
</div>

<script>
    document.getElementById("city_type").addEventListener("change", function() {
        var selectedStore = this.value;
        var imageElement = document.getElementById("image");

        // Change image based on selected option
        if (selectedStore === "Bucharest") {
            imageElement.src = "Bucharest.jpg"; // Update to your image path
            imageElement.alt = "Bucharest";
        } else if (selectedStore === "New York City") {
            imageElement.src = "../Harta_NYC.png"; // Update to your image path
            imageElement.alt = "NYC";
        } else {
            imageElement.src = "none.jpg"; // Default image when "None" is selected
            imageElement.alt = "No Store Selected";
        }
    });
</script>

</html>
